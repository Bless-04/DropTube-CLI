[package]
name = "droptube"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "trace", "catch-panic"] }
local-ip-address = "0.6"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4.33"
stderrlog = "0.6"
clap = { version = "4.6.4", features = ["derive"] }


