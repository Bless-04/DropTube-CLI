{% extends "base.html" %}
{% block search_value %}{{ search_query }}{% endblock %}
{% block explorer_active %}selected{% endblock %}
{% block content %}
<div class="feed-content explorer">
    <div class="feed-heading"><div><p class="eyebrow">YOUR LOCAL LIBRARY</p><h1>Browse folders</h1></div><a href="/" class="button">Back to videos</a></div>
    <nav class="breadcrumbs" aria-label="Folder path">{{ breadcrumbs_html|safe }}</nav>
    <div class="table-container"><table><thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Last modified</th></tr></thead><tbody>{{ entries_html|safe }}</tbody></table></div>
</div>
{% endblock %}
