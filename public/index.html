<!DOCTYPE html>
<html lang="en" class="bg-[#0f0f0f]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropTube - Seamless LAN Media Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preload" href="index.css" as="style">
    <link rel="stylesheet" href="index.css">
</head>

<body class="bg-[#0f0f0f] text-white antialiased selection:bg-red-600 selection:text-white min-h-screen flex flex-col">
    <!-- Header -->
    <header
        class="sticky top-0 z-50 bg-[#0f0f0f]/90 backdrop-blur-md border-b border-zinc-900 px-4 py-3 flex items-center justify-between">
        <a href="/public" class="flex items-center gap-2 select-none group">
            <span
                class="bg-red-600 group-hover:bg-red-700 transition-colors text-white px-2.5 py-1 rounded-xl text-sm font-extrabold tracking-tighter flex items-center gap-1 shadow-lg shadow-red-600/10">
                🎬 RUST
            </span>
            <span class="text-white text-lg font-bold tracking-tight">DropTube</span>
        </a>

        <!-- Client-Side Search Bar -->
        <div class="relative max-w-xs md:max-w-md w-full mx-4 flex items-center">
            <div class="absolute left-3.5 text-zinc-500 pointer-events-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
            <label for="search"></label><input type="text" id="search" placeholder="Search videos..."
                                               class="w-full bg-[#181818] border border-zinc-800 text-zinc-200 placeholder-zinc-500 pl-10 pr-4 py-1.5 rounded-full text-xs md:text-sm focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600/30 transition-all"
                                               value="{{SEARCH_VALUE}}"
                                               oninput="handleSearch(this.value)" />
        </div>

        <!-- Navigation Actions -->
        <div class="flex items-center gap-3">
            <button onclick="refreshIndex(this)"
                class="inline-flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 active:scale-95 text-zinc-300 font-medium px-4 py-1.5 rounded-full transition-all text-xs"
                title="Force-rescan directories in background">
                <svg id="refresh-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 7.89M9 11l3 3L21 3" />
                </svg>
                <span id="refresh-text" class="hidden sm:inline">Refresh Index</span>
            </button>
            <a href="/explorer"
                class="inline-flex items-center gap-1.5 bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 active:scale-95 text-zinc-300 font-medium px-4 py-1.5 rounded-full transition-all text-xs">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
                <span class="hidden sm:inline">Explorer Mode</span>
                <span class="sm:hidden">Explorer</span>
            </a>
            <div
                class="hidden lg:flex items-center gap-2 bg-zinc-900 border border-zinc-800 rounded-full px-3.5 py-1.5 text-xs text-zinc-400 font-medium">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                LAN: {{LOCAL_IP}}:{{PORT}}
            </div>
        </div>
    </header>

    <!-- Horizontal Category Filter Tags -->
    <div
        class="bg-[#0f0f0f] border-b border-zinc-900 py-3 px-4 flex gap-2 overflow-x-auto scrollbar-thin max-w-7xl mx-auto w-full select-none">
        <button onclick="filterByTag('all')"
            class="tag-btn {{ALL_BTN_CLASS}} text-xs px-4 py-1.5 rounded-full active:scale-95 transition-all flex-shrink-0">
            All
        </button>
        {{TAG_FILTERS}}
    </div>

    <!-- Main Workspace -->
    <main class="flex-grow">
        {{CONTENT}}
    </main>

    <!-- Sticky Bottom Info Bar for Mobile -->
    <div
        class="md:hidden sticky bottom-0 left-0 right-0 bg-[#121212]/95 backdrop-blur border-t border-zinc-800 px-4 py-2 text-center text-[10px] text-zinc-400 z-40">
        Streaming from Host IP: <span class="text-zinc-200 font-semibold">{{LOCAL_IP}}:{{PORT}}</span>
    </div>

    <!-- Footer -->
    <footer class="border-t border-zinc-950 bg-[#090909] py-6 px-4 text-center text-xs text-zinc-600 mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <p>© 2026 DropTube Media Server</p>
            <p class="flex items-center gap-2">
                <span
                    class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-[10px] text-zinc-500">Stateless</span>
                <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-[10px] text-zinc-500">Enums &
                    Sidecars</span>
                <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-[10px] text-zinc-500">HTTP 206
                    Ranges</span>
                <span class="bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded text-[10px] text-zinc-500">Zero-Copy
                    Tokio</span>
            </p>
        </div>
    </footer>

    <script src="index.js"></script>
</body>

</html>
